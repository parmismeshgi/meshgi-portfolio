<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Backoffice — Parmis Meshgi</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    /* Portfolio (editorial frame) */
    --paper: #F3EEE4;
    --paper-2: #EEE7D9;
    --ink: #1A1815;
    --ink-2: #3B3630;
    --muted: #8A8276;
    --line: #D9D1C1;
    --accent: oklch(0.64 0.22 28);
    --accent-ink: oklch(0.45 0.18 28);

    /* Volante Backoffice palette — lifted from the Figma */
    --v-bg:        rgb(243,245,249);
    --v-surface:   rgb(255,255,255);
    --v-ink:       rgb(21,41,53);
    --v-ink-2:     rgb(90,104,114);
    --v-ink-3:     rgb(159,166,181);
    --v-line:      rgb(227,231,236);
    --v-line-2:    rgb(242,242,242);
    --v-blue:      rgb(59,124,247);
    --v-blue-2:    rgb(68,127,247);
    --v-blue-tint: rgb(235,241,254);
    --v-green:     rgb(94,205,177);
    --v-red:       rgb(249,154,177);
    --v-violet:    rgb(151,132,240);
    --v-hover:     rgb(249,250,252);

    --serif: 'Instrument Serif', ui-serif, Georgia, serif;
    --sans:  'Inter', system-ui, -apple-system, sans-serif;
    --mono:  'JetBrains Mono', ui-monospace, monospace;
    --v-font: 'Poppins', 'Helvetica Neue', system-ui, sans-serif;
  }

  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  body {
    background-color: var(--paper);
    background-image: radial-gradient(rgba(26,24,21,0.025) 1px, transparent 1px);
    background-size: 20px 20px;
    overflow-x: hidden;
  }
  * { box-sizing: border-box; }
  a { color: inherit; }
  button { font-family: inherit; }

  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; opacity: 0.04; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  ::selection { background: var(--accent); color: white; }
</style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="src/backoffice/chrome.jsx"></script>
  <script type="text/babel" src="src/backoffice/customer-mgmt.jsx"></script>
  <script type="text/babel" src="src/backoffice/placeholders.jsx"></script>
  <script type="text/babel" src="src/backoffice/page.jsx"></script>
  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById('app'));
    root.render(<BackofficePage />);
  </script>
</body>
</html>
