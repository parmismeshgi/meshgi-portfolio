<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Self-Serving Kiosk — Parmis Meshgi</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #F3EEE4;
    --paper-2: #EEE7D9;
    --ink: #1A1815;
    --ink-2: #3B3630;
    --muted: #8A8276;
    --line: #D9D1C1;
    --accent: oklch(0.64 0.22 28);
    --accent-ink: oklch(0.45 0.18 28);

    /* Volante Kiosk palette — lifted from the Figma */
    --k-teal:        rgb(13,125,140);
    --k-teal-dark:   rgb(10,95,105);
    --k-teal-tint:   rgb(236,244,245);
    --k-ink:         rgb(40,41,54);
    --k-bg:          rgb(255,255,255);
    --k-surface:     rgb(243,244,245);
    --k-dark:        rgb(33,35,49);
    --k-divider:     rgb(225,228,231);
    --k-muted:       rgb(140,143,150);

    --serif: 'Instrument Serif', ui-serif, Georgia, serif;
    --sans:  'Inter', system-ui, -apple-system, sans-serif;
    --mono:  'JetBrains Mono', ui-monospace, monospace;
    --k-font:'Inter', 'Helvetica Neue', system-ui, sans-serif;
  }

  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  body {
    background-color: var(--paper);
    background-image: radial-gradient(rgba(26,24,21,0.025) 1px, transparent 1px);
    background-size: 20px 20px;
    overflow-x: hidden;
  }
  * { box-sizing: border-box; }
  a { color: inherit; }
  button { font-family: inherit; }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: 0.04; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  ::selection { background: var(--accent); color: white; }
</style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="src/kiosk/screens.jsx"></script>
  <script type="text/babel" src="src/kiosk/page.jsx"></script>
  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById('app'));
    root.render(<KioskPage />);
  </script>
</body>
</html>
